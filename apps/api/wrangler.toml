name = "academy-tutoring-api"
main = "src/index.ts"
compatibility_date = "2024-05-24"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "academy-tutoring-db"
database_id = "f187b836-b9a2-4d9c-9223-161baac16e30"

[[kv_namespaces]]
binding = "KV"
id = "4fa2aa81c978495cb266e0c8218f5116"

[vars]
SCHOOL_EMAIL_DOMAIN = "yourschool.org"
FROM_EMAIL = "noreply@aosm-tutoring.org"
ADMIN_NOTIFICATION_EMAIL = "noreply@aosm-tutoring.org"
WEB_URL = "https://aosm-tutoring.org"
# Google OAuth client ID — public, safe to commit. Get from Google Cloud Console
# → Credentials → OAuth 2.0 Web Client. Registered redirect URIs must include
#   http://localhost:8787/api/auth/google/callback
#   http://localhost:5173/api/auth/google/callback  (Vite proxy + API_PUBLIC_URL in .dev.vars)
#   https://academy-tutoring-api.seonkim1003.workers.dev/api/auth/google/callback
# Authorized JavaScript origins (Google Console): https://aosm-tutoring.org
GOOGLE_CLIENT_ID = "195876416902-c1i9k9ce47tauq5526u7phmkc69p8g6d.apps.googleusercontent.com"
# Local only (.dev.vars): API_PUBLIC_URL=http://localhost:5173 WEB_URL=http://localhost:5173

# Secrets (set via `wrangler secret put`):
#   RESEND_API_KEY
#   SESSION_COOKIE_SECRET
#   GOOGLE_CLIENT_SECRET
# For local dev: put GOOGLE_CLIENT_SECRET=... in apps/api/.dev.vars (gitignored).

[triggers]
crons = [
  "0 13 * * *",  # Daily 1pm UTC — send next-day session reminders
  "0 14 * * *"   # Daily 2pm UTC — follow up on stale matches
]

[dev]
port = 8787
local_protocol = "http"
